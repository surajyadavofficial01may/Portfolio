<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2744"/>
      <stop offset="100%" stop-color="#061626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base Tile with Rounded Corners -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg-grad)" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" stroke="#60A5FA" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Pixel Hair -->
  <rect x="9" y="5" width="14" height="6" rx="1" fill="#0B132B"/>
  <rect x="7" y="8" width="3" height="7" fill="#0B132B"/>
  <rect x="22" y="8" width="3" height="7" fill="#0B132B"/>

  <!-- Face -->
  <rect x="10" y="8" width="12" height="10" rx="1" fill="#F5E3CA"/>

  <!-- Retro Yellow Glasses -->
  <rect x="9" y="11" width="6" height="4" rx="1" fill="#D7A93D" fill-opacity="0.25" stroke="#E5A93C" stroke-width="1.2"/>
  <rect x="17" y="11" width="6" height="4" rx="1" fill="#D7A93D" fill-opacity="0.25" stroke="#E5A93C" stroke-width="1.2"/>
  <rect x="14.5" y="12" width="3" height="1.2" fill="#E5A93C"/>

  <!-- Eyes behind glasses -->
  <rect x="12" y="12.5" width="1.8" height="2" rx="0.5" fill="#092A4A"/>
  <rect x="18.2" y="12.5" width="1.8" height="2" rx="0.5" fill="#092A4A"/>
  <rect x="13" y="12.5" width="0.8" height="0.8" fill="#FFFFFF"/>
  <rect x="19.2" y="12.5" width="0.8" height="0.8" fill="#FFFFFF"/>

  <!-- Smile -->
  <rect x="14" y="16" width="4" height="0.8" rx="0.4" fill="#C28246"/>

  <!-- Shirt / Body -->
  <path d="M7 21C7 19.8954 7.89543 19 9 19H23C24.1046 19 25 19.8954 25 21V30H7V21Z" fill="#1D4ED8"/>
  <polygon points="13,19 19,19 17,24 15,24" fill="#F8FAFC"/>
  <!-- Red Straps -->
  <rect x="8.5" y="19" width="2.5" height="11" fill="#DC2626"/>
  <rect x="21" y="19" width="2.5" height="11" fill="#DC2626"/>

  <!-- Status Online Indicator LED -->
  <circle cx="26" cy="6" r="3.2" fill="#064E3B" stroke="#047857" stroke-width="0.8"/>
  <circle cx="26" cy="6" r="2.2" fill="#10B981"/>
  <circle cx="25.3" cy="5.3" r="0.8" fill="#D1FAE5"/>
</svg>
